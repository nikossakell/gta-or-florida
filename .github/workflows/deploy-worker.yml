name: Deploy Worker

# Staging deploys automatically from main; production only via manual dispatch,
# gated by the GitHub "production" environment (add required reviewers there).
# Do NOT also connect the Worker to Cloudflare's dashboard Git integration
# (that would deploy every push twice). Pages uses the dashboard Git integration.
on:
  push:
    branches: [main]
    paths: ['apps/worker/**', 'packages/**', 'package-lock.json']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      apply_migrations:
        description: Apply pending D1 migrations (a D1 export is taken first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    # Inert until the owner adds the Cloudflare deploy token to the environment.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.WORKER_DEPLOY_ENABLED == 'true' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npm test -- --project worker
        working-directory: .
      - name: Refuse placeholder D1 ids
        run: |
          if node -e "const t=require('fs').readFileSync('wrangler.jsonc','utf8');const m=t.match(/\"database_name\": \"gta-or-florida-${TARGET}\",\s*\"database_id\": \"([^\"]+)\"/);process.exit(m&&!m[1].startsWith('REPLACE_WITH')?0:1)"; then echo "D1 id set for $TARGET"; else echo "::error::Set the real database_id for gta-or-florida-$TARGET in apps/worker/wrangler.jsonc"; exit 1; fi
      - name: Back up D1 before migrating
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 export "gta-or-florida-${TARGET}" --remote --env "$TARGET" --output "d1-backup-${TARGET}.sql"
      - name: Upload backup
        if: ${{ inputs.apply_migrations }}
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ env.TARGET }}-${{ github.run_id }}
          path: apps/worker/d1-backup-${{ env.TARGET }}.sql
          retention-days: 30
      - name: Apply migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply "gta-or-florida-${TARGET}" --remote --env "$TARGET"
      - name: Deploy
        run: npx wrangler deploy --env "$TARGET" --var "APP_VERSION:${GITHUB_SHA::12}"
      - name: Sync source policy registry into D1
        if: ${{ vars.WORKER_URL != '' && env.ADMIN_TOKEN != '' }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $ADMIN_TOKEN" -H 'content-type: application/json' -H 'x-actor: deploy-workflow' -d '{}' "${{ vars.WORKER_URL }}/api/v1/admin/sources/sync"
      - name: Smoke test
        if: ${{ vars.WORKER_URL != '' }}
        working-directory: .
        run: npm run smoke -- "${{ vars.WORKER_URL }}"
