name: Netlify daily rebuild

# Netlify has no scheduled builds. This triggers a Netlify build hook every day
# shortly after 00:00 UTC so each round is published on its own day.
#
# Setup: Netlify → Site configuration → Build & deploy → Build hooks → Add build hook,
# then save its URL as the repository secret NETLIFY_BUILD_HOOK_URL.
# Without the secret this workflow does nothing.

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 -X POST -d '{}' "$HOOK_URL"
          echo "Netlify build triggered."
