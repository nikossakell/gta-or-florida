name: Ingest content

# Batch discovery → verification → Workers AI classification → authenticated import.
# Runs on GitHub-hosted runners only; no backend process is involved. Scheduled runs
# can be delayed or skipped by GitHub — the Worker keeps ~30 days of rounds queued,
# so public availability never depends on this exact timing.
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      source:
        description: Which providers
        type: choice
        options: [all, florida, gta]
        default: all
      dry_run:
        description: Discover and classify only (no import)
        type: boolean
        default: false

permissions:
  contents: read

# One import job per environment at a time; never cancel a run mid-import.
concurrency:
  group: gta-florida-ingest-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'production' }}
    # Scheduled runs are inert until the owner has configured the environment.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.INGESTION_API_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run batch
        run: npm run ingest:batch -- --source "${{ inputs.source || 'all' }}" ${{ inputs.dry_run && '--dry-run' || '' }} --schedule --report reports/ingest.json
        env:
          CF_AI_ACCOUNT_ID: ${{ secrets.CF_AI_ACCOUNT_ID }}
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
          INGESTION_IMPORT_TOKEN: ${{ secrets.INGESTION_IMPORT_TOKEN }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'auto' }}
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-${{ github.run_id }}
          path: reports/ingest.json
          retention-days: 7
          if-no-files-found: ignore
