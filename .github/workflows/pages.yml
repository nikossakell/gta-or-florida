name: Deploy to GitHub Pages

# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The site is rebuilt every day shortly after 00:00 UTC so each round is
# published on its own day and never earlier (static hosting cannot hide
# future answers, so we simply don't upload them yet).

on:
  push:
    branches: [main]
  schedule:
    # GitHub may delay scheduled runs at busy times; until it runs, players see "No headlines today".
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build static site
        run: npm run build:pages
        env:
          # "/<repo>" for project sites, "" for user sites or custom domains.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Share links point at the deployed site.
          VITE_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
          # Sample data is placeholder content. Set the repository variable
          # ALLOW_PLACEHOLDER_CONTENT=false once real, verified questions are in place.
          ALLOW_PLACEHOLDER_CONTENT: ${{ vars.ALLOW_PLACEHOLDER_CONTENT || 'true' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
