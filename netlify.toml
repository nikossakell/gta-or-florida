# LEGACY — the fully static demo (placeholder content from data/*.json) that is live today.
# Keep it serving users until the Cloudflare Pages + Worker production is verified
# (README_DEPLOYMENT.md, "Cutover"). Then delete this file, .github/workflows/netlify-daily.yml
# and the Netlify site. The Node API proxy mode was removed with the Node server.
[build]
  # (Variables set in netlify.toml would override the UI, so the default is set inline.)
  command = "ALLOW_PLACEHOLDER_CONTENT=${ALLOW_PLACEHOLDER_CONTENT:-true} npm run build:pages"
  publish = "apps/web/dist-pages"

# Missing data files must be real 404s (e.g. today's round not published yet), not the SPA shell.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# SPA fallback: deep links like /archive or /play/2026-11-19 load the app with HTTP 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
